<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ספר דיגיטלי</title>
  <meta name="description" content="ספר דיגיטלי לדפדוף." />
  <meta property="og:title" content="ספר דיגיטלי" />
  <meta property="og:description" content="ספר דיגיטלי לדפדוף." />
  <meta property="og:type" content="book" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Loading overlay -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__book" aria-hidden="true"></div>
    <p class="loader__text">טוען את הספר…</p>
  </div>

  <!-- Top toolbar -->
  <header class="toolbar" id="toolbar">
    <div class="toolbar__title">
      <span class="toolbar__name" id="book-title">ספר דיגיטלי</span>
      <span class="toolbar__sub" id="book-sub"></span>
    </div>
    <div class="toolbar__actions">
      <button class="btn" id="btn-thumbs" title="תצוגת עמודים" aria-label="תצוגת עמודים">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="btn" id="btn-zoom-out" title="הקטנה (-)" aria-label="הקטנה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
      <button class="btn" id="btn-zoom-in" title="הגדלה (+)" aria-label="הגדלה">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
      <button class="btn" id="btn-fullscreen" title="מסך מלא (F)" aria-label="מסך מלא">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none"/></svg>
      </button>
      <a class="btn" id="btn-download" href="#" download title="הורדת PDF" aria-label="הורדת PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 11l5 5 5-5M5 21h14" fill="none"/></svg>
      </a>
    </div>
  </header>

  <!-- Book stage -->
  <main class="stage" id="stage">
    <button class="nav nav--prev" id="nav-prev" aria-label="העמוד הקודם">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none"/></svg>
    </button>

    <div class="viewport" id="viewport">
      <div class="flip-scale" id="flip-scale">
        <div class="flip-mirror" id="flip-mirror">
          <div id="flipbook" class="flipbook" dir="ltr"></div>
        </div>
      </div>
    </div>

    <button class="nav nav--next" id="nav-next" aria-label="העמוד הבא">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none"/></svg>
    </button>
  </main>

  <!-- Bottom bar -->
  <footer class="statusbar" id="statusbar">
    <button class="btn btn--text" id="btn-first" title="לתחילת הספר">⏮ ראשון</button>
    <div class="pageind">
      <span id="page-current">1</span>
      <span class="pageind__sep">/</span>
      <span id="page-total">60</span>
    </div>
    <button class="btn btn--text" id="btn-last" title="לסוף הספר">אחרון ⏭</button>
  </footer>

  <!-- Thumbnails drawer -->
  <aside class="thumbs" id="thumbs" aria-hidden="true">
    <div class="thumbs__head">
      <span>עמודים</span>
      <button class="btn btn--ghost" id="btn-thumbs-close" aria-label="סגירה">✕</button>
    </div>
    <div class="thumbs__grid" id="thumbs-grid"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script src="lib/page-flip.browser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
