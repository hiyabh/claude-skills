<!--
  CODE VISUALIZER — Slide Deck Template
  Full-screen code presentation slides. Self-contained, no server needed.
  Keyboard: Arrows = navigate, F = fullscreen, T = theme toggle, Esc = exit fullscreen
  Placeholders: {{TITLE}}, {{AUTHOR}}, {{SLIDES}}, {{METADATA}}
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #282a36; --bg-alt: #1e1f29; --bg-card: #343746;
      --text: #f8f8f2; --text-dim: #9ea4b3;
      --accent: #bd93f9; --accent2: #50fa7b;
      --green: #50fa7b; --red: #ff5555; --yellow: #f1fa8c; --orange: #ffb86c; --cyan: #8be9fd; --pink: #ff79c6;
      --font-prose: 'Inter', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', monospace;
      --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="light"] {
      --bg: #f5f5f5; --bg-alt: #ffffff; --bg-card: #e8e8e8;
      --text: #282a36; --text-dim: #6272a4; --accent: #7c3aed;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-prose); }

    /* --- Slide Container --- */
    #deck { position: relative; width: 100vw; height: 100vh; }
    .slide {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 4vh 6vw;
      opacity: 0; transform: translateX(60px); pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
    }
    .slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
    .slide.prev { opacity: 0; transform: translateX(-60px); }

    /* --- Slide Types --- */
    .slide-title { text-align: center; }
    .slide-title h1 { font-size: clamp(2.4rem, 5vw, 4.5rem); font-weight: 700; margin-bottom: 0.3em; color: var(--accent); }
    .slide-title .subtitle { font-size: clamp(1rem, 2vw, 1.6rem); color: var(--text-dim); }
    .slide-title .author { margin-top: 1.5em; font-size: 1rem; color: var(--text-dim); opacity: 0.7; }

    .slide-content { max-width: 900px; width: 100%; align-items: flex-start; }
    .slide-content h2 { font-size: clamp(1.6rem, 3vw, 2.6rem); margin-bottom: 0.6em; color: var(--accent); }
    .slide-content .body { font-size: clamp(1rem, 1.6vw, 1.3rem); line-height: 1.75; color: var(--text); }
    .slide-content .body p { margin-bottom: 0.8em; }
    .slide-content .body ul, .slide-content .body ol { padding-left: 1.5em; margin-bottom: 0.8em; }
    .slide-content .body li { margin-bottom: 0.4em; }
    .slide-content .body strong { color: var(--accent); }
    .slide-content .body code { font-family: var(--font-code); background: var(--bg-card); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }

    .slide-code { max-width: 960px; width: 100%; align-items: flex-start; }
    .slide-code h2 { font-size: clamp(1.4rem, 2.5vw, 2.2rem); margin-bottom: 0.5em; color: var(--accent); }
    .slide-code pre { width: 100%; border-radius: 12px; overflow: auto; max-height: 65vh; }
    .slide-code pre code { font-family: var(--font-code); font-size: clamp(0.8rem, 1.3vw, 1.05rem); line-height: 1.6; padding: 1.5em !important; }

    .slide-diagram { max-width: 960px; width: 100%; text-align: center; }
    .slide-diagram h2 { font-size: clamp(1.4rem, 2.5vw, 2.2rem); margin-bottom: 0.6em; color: var(--accent); }
    .slide-diagram .mermaid-wrap { display: flex; justify-content: center; margin-top: 1em; }
    .slide-diagram .mermaid-wrap svg { max-height: 60vh; max-width: 100%; }

    .slide-split { max-width: 1100px; width: 100%; align-items: flex-start; }
    .slide-split h2 { font-size: clamp(1.4rem, 2.5vw, 2.2rem); margin-bottom: 0.5em; color: var(--accent); width: 100%; }
    .split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5vw; width: 100%; align-items: start; }
    .split-row pre { border-radius: 12px; overflow: auto; max-height: 55vh; }
    .split-row pre code { font-family: var(--font-code); font-size: clamp(0.75rem, 1.1vw, 0.95rem); line-height: 1.55; padding: 1.2em !important; }
    .split-row .explanation { font-size: clamp(0.9rem, 1.3vw, 1.15rem); line-height: 1.7; color: var(--text); padding-top: 0.5em; }
    .split-row .explanation p { margin-bottom: 0.7em; }

    /* --- HUD --- */
    #counter {
      position: fixed; top: 1.2rem; right: 1.5rem; z-index: 100;
      font-family: var(--font-code); font-size: 0.85rem; color: var(--text-dim);
      background: var(--bg-alt); padding: 0.3em 0.8em; border-radius: 6px; opacity: 0.8;
    }
    #progress {
      position: fixed; bottom: 0; left: 0; height: 3px; z-index: 100;
      background: var(--accent); transition: width var(--transition);
    }
    #controls {
      position: fixed; bottom: 1rem; right: 1.5rem; z-index: 100;
      display: flex; gap: 0.5rem; opacity: 0; transition: opacity 0.3s;
    }
    #deck:hover #controls { opacity: 0.6; }
    #controls:hover { opacity: 1 !important; }
    .ctrl-btn {
      background: var(--bg-card); border: 1px solid var(--text-dim); color: var(--text-dim);
      font-family: var(--font-code); font-size: 0.7rem; padding: 0.3em 0.6em;
      border-radius: 4px; cursor: pointer; transition: all 0.2s;
    }
    .ctrl-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* --- Light-theme hljs override --- */
    [data-theme="light"] pre code.hljs { background: #f0f0f0; color: #282a36; }
  </style>
</head>
<body>
  <div id="deck"></div>
  <div id="counter"></div>
  <div id="progress"></div>
  <div id="controls">
    <button class="ctrl-btn" onclick="prevSlide()" title="Previous">&larr;</button>
    <button class="ctrl-btn" onclick="nextSlide()" title="Next">&rarr;</button>
    <button class="ctrl-btn" onclick="toggleTheme()" title="Toggle theme (T)">T</button>
    <button class="ctrl-btn" onclick="goFullscreen()" title="Fullscreen (F)">F</button>
  </div>
  <!-- {{METADATA}} -->
  <script>
  (function() {
    const TITLE = `{{TITLE}}`;
    const AUTHOR = `{{AUTHOR}}`;
    const SLIDES = {{SLIDES}};

    const deck = document.getElementById('deck');
    const counter = document.getElementById('counter');
    const progress = document.getElementById('progress');
    let current = 0;
    const total = SLIDES.length;

    /* --- Markdown-lite parser for body text --- */
    function mdLite(text) {
      if (!text) return '';
      return text
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
        .replace(/<\/ul>\s*<ul>/g, '')
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/^(?!<[hulo])(.+)$/gm, '<p>$1</p>')
        .replace(/<p><\/p>/g, '');
    }

    function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    /* --- Build slides --- */
    SLIDES.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'slide slide-' + (s.type || 'content');
      el.dataset.index = i;
      if (i === 0) el.classList.add('active');

      let html = '';
      switch (s.type) {
        case 'title':
          html = `<h1>${escHtml(s.title || TITLE)}</h1>`;
          if (s.body) html += `<div class="subtitle">${escHtml(s.body)}</div>`;
          if (AUTHOR) html += `<div class="author">${escHtml(AUTHOR)}</div>`;
          break;
        case 'code':
          if (s.title) html += `<h2>${escHtml(s.title)}</h2>`;
          html += `<pre><code class="language-${s.language || 'plaintext'}">${escHtml(s.code || '')}</code></pre>`;
          break;
        case 'diagram':
          if (s.title) html += `<h2>${escHtml(s.title)}</h2>`;
          html += `<div class="mermaid-wrap"><pre class="mermaid">${escHtml(s.mermaid || '')}</pre></div>`;
          break;
        case 'split':
          if (s.title) html += `<h2>${escHtml(s.title)}</h2>`;
          html += `<div class="split-row">
            <pre><code class="language-${s.language || 'plaintext'}">${escHtml(s.code || '')}</code></pre>
            <div class="explanation">${mdLite(s.body || '')}</div>
          </div>`;
          break;
        default: /* content */
          if (s.title) html += `<h2>${escHtml(s.title)}</h2>`;
          html += `<div class="body">${mdLite(s.body || '')}</div>`;
      }
      el.innerHTML = html;
      deck.appendChild(el);
    });

    const slides = deck.querySelectorAll('.slide');

    function goTo(n) {
      if (n < 0 || n >= total) return;
      slides[current].classList.remove('active');
      slides[current].classList.add(n > current ? 'prev' : '');
      setTimeout(() => slides[current === n ? current : (n > current ? current : current)].classList.remove('prev'), 50);
      const prev = current;
      current = n;
      slides.forEach((s, i) => {
        s.classList.remove('active', 'prev');
        if (i === current) s.classList.add('active');
        else if (i < current) s.classList.add('prev');
      });
      counter.textContent = `${current + 1} / ${total}`;
      progress.style.width = `${((current + 1) / total) * 100}%`;
      initSlideContent(current);
    }

    function nextSlide() { goTo(current + 1); }
    function prevSlide() { goTo(current - 1); }
    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;

    /* --- Highlight & Mermaid per-slide --- */
    const hlInit = new Set();
    function initSlideContent(idx) {
      if (hlInit.has(idx)) return;
      hlInit.add(idx);
      const sl = slides[idx];
      sl.querySelectorAll('pre code[class*="language-"]').forEach(block => hljs.highlightElement(block));
      sl.querySelectorAll('.mermaid').forEach(el => {
        if (el.dataset.processed) return;
        const id = 'mmd-' + idx + '-' + Math.random().toString(36).slice(2, 7);
        mermaid.render(id, el.textContent).then(({ svg }) => { el.innerHTML = svg; });
        el.dataset.processed = 'true';
      });
    }

    /* --- Theme toggle --- */
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = next;
      mermaid.initialize({ startOnLoad: false, theme: next === 'dark' ? 'dark' : 'default' });
    }
    window.toggleTheme = toggleTheme;

    /* --- Fullscreen --- */
    function goFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    }
    window.goFullscreen = goFullscreen;

    /* --- Keyboard --- */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevSlide(); }
      else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
      else if (e.key === 'End') { e.preventDefault(); goTo(total - 1); }
      else if (e.key === 'f' || e.key === 'F') goFullscreen();
      else if (e.key === 't' || e.key === 'T') toggleTheme();
      else if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
    });

    /* --- Touch swipe --- */
    let touchX = 0;
    deck.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    deck.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) dx > 0 ? prevSlide() : nextSlide();
    }, { passive: true });

    /* --- Init --- */
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
    goTo(0);
  })();
  </script>
</body>
</html>
