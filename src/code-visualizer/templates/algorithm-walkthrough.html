<!--
  CODE VISUALIZER — Algorithm Walkthrough Template
  Two-panel step-by-step code walkthrough with line highlighting,
  mermaid diagrams, and keyboard navigation.
  Claude replaces {{PLACEHOLDERS}} when generating.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg-primary: #282a36; --bg-secondary: #1e1f29; --bg-card: #343746;
      --text-primary: #f8f8f2; --text-secondary: #9ea4b3;
      --accent: #bd93f9; --accent-hover: #caa4ff;
      --green: #50fa7b; --red: #ff5555; --yellow: #f1fa8c; --orange: #ffb86c;
      --cyan: #8be9fd; --pink: #ff79c6;
      --line-highlight: rgba(189,147,249,0.12); --line-highlight-border: var(--accent);
      --radius: 8px; --transition: 0.2s ease;
    }
    [data-theme="light"] {
      --bg-primary: #f4f4f8; --bg-secondary: #ffffff; --bg-card: #e9e9f0;
      --text-primary: #2e2e3a; --text-secondary: #6b6b80;
      --accent: #7c4dff; --accent-hover: #651fff;
      --line-highlight: rgba(124,77,255,0.1); --line-highlight-border: var(--accent);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif; background: var(--bg-primary);
      color: var(--text-primary); line-height: 1.6; min-height: 100vh;
      display: flex; flex-direction: column; transition: background var(--transition), color var(--transition);
    }
    /* --- Header --- */
    .header {
      padding: 1rem 2rem; background: var(--bg-secondary);
      border-bottom: 1px solid var(--bg-card); display: flex; align-items: center; gap: 1rem;
    }
    .header-text { flex: 1; }
    .header h1 { font-size: 1.3rem; font-weight: 700; }
    .header .subtitle { font-size: 0.85rem; color: var(--text-secondary); }
    .badge {
      display: inline-block; padding: 0.15rem 0.6rem; border-radius: 99px;
      font-size: 0.75rem; font-weight: 600; font-family: 'JetBrains Mono', monospace;
      background: var(--accent); color: var(--bg-primary);
    }
    .theme-btn {
      background: var(--bg-card); border: 1px solid var(--text-secondary);
      color: var(--text-primary); border-radius: var(--radius); padding: 0.4rem 0.8rem;
      cursor: pointer; font-size: 0.8rem; transition: all var(--transition);
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    /* --- Diagram --- */
    .diagram-section {
      padding: 1rem 2rem; background: var(--bg-secondary);
      border-bottom: 1px solid var(--bg-card); text-align: center;
    }
    .diagram-section:empty { display: none; }
    .mermaid svg { max-width: 100%; }
    /* --- Main panels --- */
    .main { display: flex; flex: 1; overflow: hidden; }
    .panel-code, .panel-steps { overflow-y: auto; padding: 1.5rem; }
    .panel-code { flex: 1.2; background: var(--bg-secondary); border-right: 1px solid var(--bg-card); }
    .panel-steps { flex: 1; }
    /* --- Code block with line numbers --- */
    .code-wrap { position: relative; }
    .code-wrap pre { margin: 0; padding: 0; background: transparent !important; }
    .code-wrap code { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.7; }
    .code-table { width: 100%; border-collapse: collapse; }
    .code-table td { padding: 0; vertical-align: top; white-space: pre; }
    .line-num {
      width: 3rem; text-align: right; padding-right: 1rem; user-select: none;
      color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; opacity: 0.5;
    }
    .line-content {
      font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
      padding-left: 0.5rem; transition: background var(--transition);
    }
    tr.highlighted .line-num { color: var(--accent); opacity: 1; }
    tr.highlighted .line-content {
      background: var(--line-highlight);
      border-left: 3px solid var(--line-highlight-border);
      padding-left: calc(0.5rem - 3px);
    }
    /* --- Step cards --- */
    .step-card {
      padding: 0.9rem 1rem; margin-bottom: 0.75rem; border-radius: var(--radius);
      background: var(--bg-card); cursor: pointer; border: 2px solid transparent;
      transition: all var(--transition);
    }
    .step-card:hover { border-color: var(--accent); }
    .step-card.active { border-color: var(--accent); background: var(--line-highlight); }
    .step-number {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.6rem; height: 1.6rem; border-radius: 50%; font-size: 0.75rem;
      font-weight: 700; background: var(--accent); color: var(--bg-primary); margin-right: 0.5rem;
    }
    .step-title { font-weight: 600; font-size: 0.95rem; display: inline; }
    .step-desc { margin-top: 0.4rem; font-size: 0.85rem; color: var(--text-secondary); }
    .step-lines {
      margin-top: 0.3rem; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      color: var(--cyan);
    }
    /* --- Footer --- */
    .footer {
      padding: 0.5rem 2rem; background: var(--bg-secondary);
      border-top: 1px solid var(--bg-card); font-size: 0.75rem;
      color: var(--text-secondary); display: flex; justify-content: space-between; flex-wrap: wrap;
    }
    .footer kbd {
      display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px;
      background: var(--bg-card); border: 1px solid var(--text-secondary);
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; margin: 0 0.15rem;
    }
    /* --- Fullscreen --- */
    body.fullscreen .header, body.fullscreen .footer, body.fullscreen .diagram-section { display: none; }
    body.fullscreen .main { height: 100vh; }
    /* --- Responsive --- */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .panel-code { border-right: none; border-bottom: 1px solid var(--bg-card); max-height: 45vh; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-text">
      <h1>{{TITLE}}</h1>
      <div class="subtitle">{{SUBTITLE}}</div>
    </div>
    <span class="badge complexity-badge" style="display:none"></span>
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme (T)">Light Mode</button>
  </header>

  <section class="diagram-section" id="diagramSection">
    <div class="mermaid">{{MERMAID_DIAGRAM}}</div>
  </section>

  <div class="main">
    <div class="panel-code" id="codePanel"></div>
    <div class="panel-steps" id="stepsPanel"></div>
  </div>

  <footer class="footer">
    <div><kbd>&larr;</kbd><kbd>&rarr;</kbd> Navigate steps &nbsp; <kbd>T</kbd> Theme &nbsp; <kbd>F</kbd> Fullscreen &nbsp; <kbd>Esc</kbd> Exit</div>
    <div>{{METADATA}}</div>
  </footer>

  <script>
    /* === Data === */
    const CODE = `{{CODE}}`;
    const LANGUAGE = '{{LANGUAGE}}';
    const STEPS = {{STEPS}};

    /* === State === */
    let activeStep = -1;

    /* === Init code panel === */
    function initCode() {
      const lines = CODE.split('\n');
      const table = document.createElement('table');
      table.className = 'code-table';
      lines.forEach((line, i) => {
        const tr = document.createElement('tr');
        tr.dataset.line = i + 1;
        tr.innerHTML = `<td class="line-num">${i + 1}</td><td class="line-content">${escapeHtml(line)}</td>`;
        table.appendChild(tr);
      });
      const pre = document.createElement('pre');
      pre.appendChild(table);
      document.getElementById('codePanel').appendChild(pre);
      hljs.highlightAll();
      /* Re-apply highlight.js to each line-content cell */
      table.querySelectorAll('.line-content').forEach(td => {
        const result = hljs.highlight(td.textContent, { language: LANGUAGE, ignoreIllegals: true });
        td.innerHTML = result.value;
      });
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* === Init step cards === */
    function initSteps() {
      const panel = document.getElementById('stepsPanel');
      STEPS.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.dataset.index = i;
        card.innerHTML = `
          <span class="step-number">${s.number || i + 1}</span>
          <span class="step-title">${s.title}</span>
          <div class="step-desc">${s.description}</div>
          ${s.highlightLines?.length ? `<div class="step-lines">Lines: ${s.highlightLines.join(', ')}</div>` : ''}
        `;
        card.addEventListener('click', () => setActiveStep(i));
        panel.appendChild(card);
      });
    }

    /* === Highlight logic === */
    function setActiveStep(i) {
      if (i < 0 || i >= STEPS.length) return;
      activeStep = i;
      document.querySelectorAll('.step-card').forEach((c, j) => c.classList.toggle('active', j === i));
      document.querySelectorAll('.code-table tr').forEach(tr => tr.classList.remove('highlighted'));
      const lines = STEPS[i].highlightLines || [];
      lines.forEach(ln => {
        const tr = document.querySelector(`.code-table tr[data-line="${ln}"]`);
        if (tr) tr.classList.add('highlighted');
      });
      if (lines.length) {
        const first = document.querySelector(`.code-table tr[data-line="${lines[0]}"]`);
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      document.querySelectorAll('.step-card')[i]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /* === Theme === */
    function toggleTheme() {
      const html = document.documentElement;
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = next;
      document.querySelector('.theme-btn').textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
    }

    /* === Keyboard === */
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); setActiveStep(activeStep + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); setActiveStep(activeStep - 1); }
      else if (e.key.toLowerCase() === 't') toggleTheme();
      else if (e.key.toLowerCase() === 'f') document.body.classList.toggle('fullscreen');
      else if (e.key === 'Escape') document.body.classList.remove('fullscreen');
    });

    /* === Complexity badge === */
    function initBadge() {
      const first = STEPS.find(s => s.complexity);
      if (first) {
        const badge = document.querySelector('.complexity-badge');
        badge.textContent = first.complexity;
        badge.style.display = 'inline-block';
      }
    }

    /* === Mermaid === */
    function initDiagram() {
      const section = document.getElementById('diagramSection');
      const content = section.querySelector('.mermaid')?.textContent.trim();
      if (!content || content === '{{MERMAID_DIAGRAM}}') { section.innerHTML = ''; return; }
      mermaid.initialize({ startOnLoad: false, theme: 'dark', fontFamily: 'Inter' });
      mermaid.run({ querySelector: '.mermaid' });
    }

    /* === Boot === */
    document.addEventListener('DOMContentLoaded', () => {
      initCode();
      initSteps();
      initBadge();
      initDiagram();
      if (STEPS.length) setActiveStep(0);
    });
  </script>
</body>
</html>
