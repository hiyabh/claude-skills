<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/kit.js"></script>
    <style>
      @font-face { font-family: "Frank Ruehl CLM"; src: url("assets/fonts/FrankRuehlCLM-Bold.otf"); font-weight: 700; }
      @font-face { font-family: "Rubik"; src: url("assets/fonts/Rubik-Bold.ttf"); font-weight: 700; }
      html, body { margin: 0; background: #0F1712; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0F1712; direction: rtl; color: #F1E9D6; }
      .clip { position: absolute; inset: 0; }
      .in { position: absolute; inset: 0; overflow: hidden; }
      .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .shot .in::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,16,12,0.55), rgba(10,16,12,0) 30%, rgba(10,16,12,0) 55%, rgba(10,16,12,0.85)); }
      .card .in { display: flex; align-items: center; justify-content: center; padding: 0 80px;
        background: radial-gradient(circle at 50% 40%, rgba(232,184,74,0.22), rgba(15,23,18,1) 65%); }
      .card .ct { font-family: "Frank Ruehl CLM"; font-weight: 700; font-size: 110px; line-height: 1.15; text-align: center; }
      #hook { position: absolute; top: 120px; right: 60px; left: 60px; text-align: center; font-family: "Frank Ruehl CLM";
        font-weight: 700; font-size: 92px; line-height: 1.1; color: #FFF6DC; text-shadow: 0 4px 0 rgba(0,0,0,0.6); z-index: 20; }
      .cap { position: absolute; top: 1260px; right: 50px; left: 50px; text-align: center; font-family: "Rubik"; font-weight: 700;
        font-size: 84px; line-height: 1.2; color: #FFFFFF; text-shadow: 0 5px 0 rgba(0,0,0,0.75), 0 0 24px rgba(0,0,0,0.7); opacity: 0; z-index: 30; }
      .cap span { display: inline-block; }
      #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #E8B84A; transform-origin: right center; z-index: 40; }
      #endc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        background: rgba(10,16,12,0.92); opacity: 0; z-index: 50; text-align: center; padding: 0 70px; }
      #endc .t { font-family: "Frank Ruehl CLM"; font-weight: 700; font-size: 100px; color: #E8B84A; line-height: 1.1; }
      #endc .s { font-family: "Rubik"; font-weight: 700; font-size: 56px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="__TOTAL__">
      __LAYERS__
      <div id="hook">__HOOK__</div>
      __CAPS__
      <div id="bar"></div>
      <div id="endc"><div class="t">__TITLE__</div><div class="s">השיעור המלא ביוטיוב</div></div>
    </div>
    <script>
      const R = document.getElementById("root");
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook", { opacity: 0, y: -40, scale: 1.3 }, { opacity: 1, y: 0, scale: 1.1, duration: 0.5, ease: "back.out(2)" }, 0);
      tl.to("#hook", { scale: 0.65, y: -50, duration: 0.6, ease: "power2.inOut" }, 3);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: __TOTAL__, ease: "none" }, 0);
      tl.fromTo("#endc", { opacity: 0 }, { opacity: 1, duration: 0.4 }, __END__);
      __JS__
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
