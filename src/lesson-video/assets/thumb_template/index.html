<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Frank Ruehl CLM"; src: url("assets/fonts/FrankRuehlCLM-Bold.otf"); font-weight: 700; }
      @font-face { font-family: "Rubik"; src: url("assets/fonts/Rubik-Bold.ttf"); font-weight: 700; }
      html, body { margin: 0; background: #0F1712; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0F1712; direction: rtl; }
      #hero { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #veil { position: absolute; inset: 0; background: linear-gradient(to left, rgba(10,16,12,0.94) 0%, rgba(10,16,12,0.82) 38%, rgba(10,16,12,0.15) 70%, rgba(10,16,12,0) 100%); }
      #txt { position: absolute; top: 0; bottom: 0; right: 90px; width: 960px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
      #kicker { align-self: flex-start; font-family: "Rubik"; font-weight: 700; font-size: 46px; color: #0F1712; background: #E8B84A;
        padding: 10px 30px; border-radius: 12px; }
      #title { font-family: "Frank Ruehl CLM"; font-weight: 700; font-size: 168px; line-height: 1.02; color: #FFF6DC;
        text-shadow: 0 6px 0 rgba(0,0,0,0.55), 0 0 40px rgba(0,0,0,0.6); }
      #title b { color: #E8B84A; font-weight: 700; }
      #sub { font-family: "Rubik"; font-weight: 700; font-size: 52px; color: #E9DFC6; text-shadow: 0 3px 0 rgba(0,0,0,0.6); }
      #badge { position: absolute; left: 50px; bottom: 50px; font-family: "Rubik"; font-weight: 700; font-size: 40px; color: #FFF6DC;
        background: rgba(10,16,12,0.8); border: 3px solid #E8B84A; padding: 8px 26px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="1">
      <img id="hero" src="assets/img/__IMG__.png" alt="" />
      <div id="veil"></div>
      <div id="txt"><div id="kicker">__KICKER__</div><div id="title">__TITLE__</div><div id="sub">__SUB__</div></div>
      <div id="badge">__BADGE__</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#root", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
