<title>@@TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-screen game canvas; a HUD of glass chips at the edges (room + minimap top, time + quality bottom),
   a centre reticle with an interaction prompt, and a loading screen that fades out once the first frame is lit. */
:root {
  --bg: #0e1013; --glass: rgba(18, 20, 24, 0.62); --glass-strong: rgba(18, 20, 24, 0.86);
  --fg: #f3f1ec; --muted: #b9b4aa; --line: rgba(255, 255, 255, 0.14); --accent: #f0b46a; --accent-fg: #1b1206;
  --font-ui: "Rubik", "Segoe UI", Arial, sans-serif; --font-num: "IBM Plex Mono", Consolas, monospace;
  --radius: 14px; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #e9e6e0; --glass: rgba(250, 249, 246, 0.7); --glass-strong: rgba(250, 249, 246, 0.92);
    --fg: #1c1b19; --muted: #5f5a52; --line: rgba(0, 0, 0, 0.12); color-scheme: light; }
}
:root[data-theme="light"] { --bg: #e9e6e0; --glass: rgba(250, 249, 246, 0.7); --glass-strong: rgba(250, 249, 246, 0.92);
  --fg: #1c1b19; --muted: #5f5a52; --line: rgba(0, 0, 0, 0.12); color-scheme: light; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.press { transition: transform 140ms var(--ease-out), background-color 160ms ease; }
.press:active { transform: scale(0.96); }

#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); transition: opacity 600ms ease; }
#loading.done { opacity: 0; pointer-events: none; }
#loading .box { width: min(380px, calc(100vw - 48px)); text-align: center; }
#loading h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.01em; }
#loading p { margin: 0 0 18px; color: var(--muted); }
.track { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
#load-bar { height: 100%; background: var(--accent); transform-origin: right; transform: scaleX(0); transition: transform 300ms var(--ease-out); }
#load-label { margin-top: 10px; font: 500 0.82rem var(--font-num); color: var(--muted); direction: rtl; }

/* HUD */
.chip { position: fixed; z-index: 4; padding: 9px 14px; }
#room { inset-block-start: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-start: 14px; min-width: 150px; }
#room-name { display: block; font-weight: 600; font-size: 1.05rem; }
#room-area { font: 500 0.8rem var(--font-num); color: var(--muted); direction: ltr; unicode-bidi: isolate; }
#map { position: fixed; z-index: 4; inset-block-start: calc(14px + env(safe-area-inset-top, 0px)); inset-inline-end: 14px; padding: 6px; }
#minimap { display: block; width: 168px; height: 168px; }
#bar { position: fixed; z-index: 4; inset-block-end: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; margin-inline: auto;
  width: max-content; max-width: calc(100vw - 20px); display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
#bar label { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; }
#time { width: min(240px, 40vw); accent-color: var(--accent); }
#time-label { font: 500 0.86rem var(--font-num); min-width: 44px; direction: ltr; unicode-bidi: isolate; }
#quality { padding: 6px 10px; border-radius: 10px; font-size: 0.82rem; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
#help { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
#reticle { position: fixed; z-index: 3; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.35); pointer-events: none; }
#prompt { position: fixed; z-index: 4; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 6px 12px; font-size: 0.9rem; pointer-events: none; }
#prompt kbd { font: 600 0.8rem var(--font-num); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); margin-inline-end: 6px; }
#act { position: fixed; z-index: 4; inset-block-end: calc(150px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 24px; padding: 14px 18px;
  border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
#toast { position: fixed; z-index: 5; inset-block-start: calc(70px + env(safe-area-inset-top, 0px)); inset-inline: 0; margin-inline: auto; width: max-content;
  padding: 9px 16px; font-weight: 600; transition: opacity 180ms ease, transform 220ms var(--ease-out); }
#toast small { margin-inline-start: 10px; font: 500 0.78rem var(--font-num); color: var(--muted); }
#toast.closed { opacity: 0; transform: translateY(-6px); pointer-events: none; }
.joy { position: fixed; z-index: 4; inset-block-end: calc(92px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 28px; width: 116px; height: 116px;
  border-radius: 50%; touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--accent); opacity: 0.9; }
#intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(10, 11, 13, 0.45);
  transition: opacity 320ms ease, backdrop-filter 320ms ease; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#intro.closed { opacity: 0; pointer-events: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
#intro .card { width: min(420px, calc(100vw - 32px)); padding: 24px 26px; text-align: center; }
#intro h2 { margin: 0 0 6px; font-size: 1.45rem; letter-spacing: -0.01em; }
#intro p { margin: 0 0 16px; color: var(--muted); }
#intro ul { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 6px; font-size: 0.9rem; text-align: start; }
#intro kbd, #resume kbd { font: 600 0.78rem var(--font-num); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); margin-inline-end: 6px; }
.go { width: 100%; padding: 12px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 1rem; }
#photo-pt { padding: 6px 10px; border-radius: 10px; font-size: 0.78rem; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
#photo { padding: 6px 10px; border-radius: 10px; font-size: 0.82rem; background: var(--accent); color: var(--accent-fg); font-weight: 600; white-space: nowrap; }
#photo-panel { position: fixed; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); padding: 16px; text-align: center; }
#photo-panel p { margin: 10px 0; color: var(--muted); font-size: 0.9rem; }
#photo-bar { height: 100%; background: var(--accent); transform-origin: right; transform: scaleX(0); }
#photo-img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
#photo-panel .row { display: flex; gap: 8px; }
#photo-panel .row button { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
#resume { position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; font-weight: 600; }
@media (max-width: 640px) {
  #minimap { width: 112px; height: 112px; }
  #help { display: none; }
  #time { width: 42vw; }
}
@media (prefers-reduced-motion: reduce) { .press:active { transform: none; } #load-bar, #toast, #intro { transition: none; } }
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--glass-strong); backdrop-filter: none; -webkit-backdrop-filter: none; } }
</style>

<div id="stage" role="img" aria-label="הדמיית הדירה"></div>
<div id="hud">
  <div id="room" class="chip glass" aria-live="polite"><span id="room-name"></span><span id="room-area"></span></div>
  <div id="map" class="glass"><canvas id="minimap" aria-label="מפת הדירה"></canvas></div>
  <div id="bar" class="glass">
    <label>שעה <input id="time" type="range" min="6" max="23" step="0.25" value="15"><span id="time-label">15:00</span></label>
    <button id="quality" class="press">איכות</button>
    <button id="photo" class="press">צילום</button>
    <button id="photo-pt" class="press" title="תאורה פיזיקלית מלאה, לוקח כמה דקות">צילום פיזיקלי (ניסיוני)</button>
    <span id="help">WASD להליכה · עכבר להסתכלות · Shift לריצה · E לפעולה</span>
  </div>
  <div id="reticle" hidden></div>
  <div id="prompt" class="glass" hidden><kbd>E</kbd><span id="prompt-text"></span></div>
  <button id="act" class="press" hidden></button>
  <div id="toast" class="glass closed" role="status"></div>
  <div class="joy glass" id="joy" hidden><i></i></div>
  <div id="walkhud" hidden></div>
  <button id="resume" class="glass press" hidden><kbd>לחיצה</kbd>להמשך הסיור</button>
  <div id="photo-panel" class="glass" hidden>
    <div class="track"><div id="photo-bar"></div></div>
    <p id="photo-label">מכין...</p>
    <img id="photo-img" alt="צילום פוטוריאליסטי של המבט הנוכחי" hidden>
    <div class="row"><button id="photo-save" class="go press" hidden>שמירת התמונה</button><button id="photo-close" class="press">סגירה</button></div>
  </div>
  <div id="intro">
    <div class="card glass">
      <h2 id="intro-title">@@TITLE</h2>
      <p>סיור חופשי בדירה, כמו במשחק</p>
      <ul id="controls">
        <li><span><kbd>WASD</kbd>הליכה · <kbd>Shift</kbd>ריצה</span></li>
        <li><span><kbd>עכבר</kbd>הסתכלות · <kbd>Esc</kbd>שחרור העכבר</span></li>
        <li><span><kbd>E</kbd>פתיחת דלת, הדלקת אור, החלפת ריצוף/צבע/חזיתות</span></li>
        <li><span>פס השעה למטה: מבוקר ועד לילה</span></li>
      </ul>
      <button id="start" class="go press">התחל סיור</button>
    </div>
  </div>
</div>
<div id="loading" role="status">
  <div class="box">
    <h1 id="load-title">@@TITLE</h1>
    <p>בונה את הדירה: חומרים, ריהוט ואור</p>
    <div class="track"><div id="load-bar"></div></div>
    <div id="load-label">מתחיל...</div>
  </div>
</div>

<script type="application/json" id="game-data">@@DATA</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@@@THREE/build/three.module.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@@@THREE/build/three.webgpu.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@@@THREE/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@@@THREE/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@@@POSTPROCESSING/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@@@N8AO/dist/N8AO.js",
  "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@@@PATHTRACER/build/index.module.js",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@@@BVH/build/index.module.js",
  "fflate": "https://cdn.jsdelivr.net/npm/fflate@@@FFLATE/esm/browser.js"
} }
</script>
<script type="module">
@@BUNDLE
</script>
